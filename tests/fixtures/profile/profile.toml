# The profile the tests use. _samples/profile shows every key.

# Commands put on PATH in every shell, read from the profile clone.
bin = "bin"

# Files that interactive shells source: aliases and functions.
shell = ["shell/example.sh"]

[secrets]
required = ["EXAMPLE_API_TOKEN"]

[tools]
jq = "1.7.1"

[[files]]
source = "files/example.conf.tmpl"
target = ".config/bivy-example/example.conf"
