name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs the same checks before it publishes a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          github_token: ${{ github.token }}
      - run: mise run lint
      - run: mise run scan

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          github_token: ${{ github.token }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      # /bin first: on macOS, povy must run on the bash 3.2 that ships with the
      # system, not on a newer one from Homebrew.
      - run: PATH="/bin:$PATH" mise run test
        env:
          GITHUB_TOKEN: ${{ github.token }}
