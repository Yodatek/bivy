name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs the same checks before it publishes a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          github_token: ${{ github.token }}
      - run: mise run lint
      - run: mise run scan

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          github_token: ${{ github.token }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      # /bin first: on macOS, povy must run on the bash 3.2 that ships with the
      # system, not on a newer one from Homebrew.
      - run: PATH="/bin:$PATH" mise run test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run test-ps
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The PowerShell engine on the system it is for, registry and bootstrap included.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
          github_token: ${{ github.token }}
      - run: ./scripts/ps-tasks.ps1 -Task test
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Last: it installs povy on the runner for real, with no test seam.
      - name: End-to-end run, from the bootstrap to doctor
        run: ./tests/ps/e2e.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
