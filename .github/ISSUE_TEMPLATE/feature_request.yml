name: Feature request
description: Something bivy could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: The engine stays generic. What one team or company needs usually belongs in its profile.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How bivy could help, such as a command or a key in profile.toml or config.toml.
