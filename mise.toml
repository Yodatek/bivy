# Tools for working on bivy itself, not installed on end-user machines.
[tools]
actionlint = "1.7.12"
bats = "1.14.0"
gitleaks = "8.30.1"
shellcheck = "0.11.0"

[tasks.test]
run = "bats tests"

[tasks.lint]
run = [
  "shellcheck -x bootstrap bin/bivy lib/*.sh lib/os/*.sh lib/cmd/*.sh tests/helper.bash .githooks/pre-push",
  "actionlint",
]

[tasks.scan]
description = "Look for secrets in the whole Git history"
run = "gitleaks git --redact --no-banner"
