# Tools for working on povy itself, not installed on end-user machines.
[tools]
actionlint = "1.7.12"
bats = "1.14.0"
"aqua:charmbracelet/freeze" = "0.2.2"
gitleaks = "8.30.1"
powershell = "7.6.10"
shellcheck = "0.11.0"

[tasks.test]
run = "bats tests"

[tasks.test-ps]
description = "Test the PowerShell engine for Windows, with Pester"
run = "pwsh -NoProfile -File scripts/ps-tasks.ps1 -Task test"

[tasks.lint]
run = [
  "shellcheck -x bootstrap bin/povy lib/*.sh lib/os/*.sh lib/cmd/*.sh tests/helper.bash .githooks/pre-push scripts/banner-image scripts/release",
  "shellcheck -s sh _samples/profile/bin/sample-hello _samples/profile/shell/aliases.sh",
  "actionlint",
  "pwsh -NoProfile -File scripts/ps-tasks.ps1 -Task lint",
]

[tasks.scan]
description = "Look for secrets in the whole Git history"
run = "gitleaks git --redact --no-banner"

[tasks.banner-image]
description = "Render docs/banner.png for the README from this machine's banner"
run = "scripts/banner-image"
